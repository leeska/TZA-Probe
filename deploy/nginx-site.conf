# TZA Probe 的 nginx HTTPS 反代示例：把 probe.example.com 与证书路径换成自己的，
# 放到 /etc/nginx/sites-available/ 并链接进 sites-enabled/，nginx -t 后 systemctl reload nginx。
# $tza_loggable 由 /etc/nginx/conf.d/tza-probe-log.conf 定义（deploy/install.sh 检测到 nginx 时自动安装）。
server {
    listen 80;
    listen [::]:80;
    server_name probe.example.com;
    access_log /var/log/nginx/access.log combined if=$tza_loggable;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name probe.example.com;
    # Agent 上报成功时不记访问日志，其余照常。
    access_log /var/log/nginx/access.log combined if=$tza_loggable;

    ssl_certificate     /etc/nginx/ssl/probe.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/probe.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:25774;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Agent 的长轮询与 MCP 的流式应答要即时转发，不能缓冲。
        proxy_buffering off;
        client_max_body_size 50M;
    }
}
