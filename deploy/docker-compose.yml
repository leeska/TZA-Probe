# 用仓库里的 Dockerfile 起一个 Server 容器（数据放命名卷，端口只绑本机）。
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
# 后台初始用户名与密码只在首次启动的日志里出现一次：docker compose -f deploy/docker-compose.yml logs tza-server
# 登录密钥：docker exec tza-server cat /data/admin-token
# 忘记后台密码：docker exec tza-server tza-server reset-password --data /data
services:
  tza-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tza-probe:local
    container_name: tza-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:25774:25774"
    volumes:
      - tza-data:/data

volumes:
  tza-data:
