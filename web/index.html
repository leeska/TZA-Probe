<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 标题与图标要在 theme-boot.js 之前：它按后台设的站点名称与 logo 当场改掉这两样。 -->
    <title>TZA Probe</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 后台设的默认外观与站点品牌先落地（几十字节，同步阻塞），再让 theme-boot.js 定 data-theme/data-skin、
         标题与图标；顺序反了首屏会先按内置默认闪一下。 -->
    <script src="/theme-default.js"></script>
    <script src="/theme-boot.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="TZA Probe · 自托管的主机与网络基础设施观测系统" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/base.css" />
    <!-- 液态玻璃的材质层：皮肤声明了 "base": "plain" 时由 theme-css.js 首屏前停用（运行中切换见 skins.js）。 -->
    <link rel="stylesheet" href="/glass.css" data-base-css="glass" />
    <link rel="stylesheet" href="/shadcn.css" />
    <!-- 已安装主题包的样式表在内置样式表之后挂上（见 theme-css.js）。 -->
    <script src="/theme-css.js"></script>
    <script type="module" src="/frontend.js"></script>
    <!-- app.js 的依赖要等它下载解析完才被发现，search.js → pinyin.js 还要再等一层；
         这里一次性声明，所有模块并行下载，不再一层层串行等往返。后台模块不在这里：
         只有进 /admin 时 app.js 才加载它们（见 loadAdmin）。 -->
    <link rel="modulepreload" href="/api.js" />
    <link rel="modulepreload" href="/format.js" />
    <link rel="modulepreload" href="/detail.js" />
    <link rel="modulepreload" href="/charts.js" />
    <link rel="modulepreload" href="/unlock.js" />
    <link rel="modulepreload" href="/theme.js" />
    <link rel="modulepreload" href="/skins.js" />
    <link rel="modulepreload" href="/search.js" />
    <link rel="modulepreload" href="/pinyin.js" />
    <link rel="modulepreload" href="/carrier-logos.js" />
    <link rel="modulepreload" href="/decorations.js" />
    <link rel="modulepreload" href="/ui-select.js" />
    <link rel="modulepreload" href="/brand.js" />
  </head>
  <body>
    <div id="app"><div class="loading">正在连接…</div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
