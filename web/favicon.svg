<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="TZA Probe">
  <title>TZA Probe</title>
  <!-- 与页头一致的 tza 字标；透明底，细浅色轮廓保证深浅标签栏都可辨认。 -->
  <text x="30" y="46" text-anchor="middle" textLength="58" lengthAdjust="spacingAndGlyphs"
        font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="-4"
        fill="#52525b" stroke="#fafafa" stroke-width="1" paint-order="stroke fill">t<tspan fill="#82828b">z</tspan>a</text>
</svg>
